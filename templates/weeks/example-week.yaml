# Example file — real weeks (weeks/20*) are gitignored.
# Step-target convention (pace ranges on hard efforts only; easy work carries a
# bare duration) is enforced by push_week.py — see its docstring. Don't restate it.
# Recovery jogs and standing rests need an explicit `intensity=` flag; without one
# Garmin shows them as plain work steps ("Run"). push_week.py checks the value.
#
# NAMES ARE PUBLIC. Garmin can stamp the workout name onto the saved activity, which
# your Garmin Connect connections see. So a name is factual and standard — the session
# type FIRST, then the structure: "Easy 7km + strides", "Threshold 4x10min",
# "Long run 26km", "MP 3x5km", "Strength 45min". Plain ASCII, no emoji, no in-jokes.
# The watch itself only shows the first 15 bytes (the FIT `wkt_name` field), which is
# why the session type leads — push_week.py enforces this and prints the truncation.
#
# EVERY WORKOUT NEEDS A `role:`. It is pushed as a `nocoach:<role>` tag on the calendar
# event, and it is the only record of what the session was FOR — the name is free text
# and distance says nothing (one athlete's long run is another's easy run), so nothing
# downstream can infer it. Without it the week's key count reads as unknown, the day
# after a hard session can't be told from recovered legs, a race just run goes undetected,
# and a mid-week re-plan under-counts the quality already done — the one case where a
# missing tag makes a rule more permissive rather than merely less sure.
# push_week.py warns on a missing one and pushes that workout untagged, so
# the week reads back as "we don't know" rather than as a wrong number; a MISSPELT one is
# an error, because it reads downstream as no role while looking labelled. The ten, exactly
# as written (lowercase; note the underscore in tune_up):
#   key       the week's quality — counts toward the key ceiling
#   long      the long run — continuity is read across it
#   easy      the one role the reference-band instrument reads, on recovered legs
#   recovery  like easy, but the band instrument is suppressed: legs not recovered
#   social    club/group run — stoppage ignored, pace not read, volume still counts
#   race      the goal race — no compliance verdict; flags a race just run (the taper
#             itself needs no tag; it fires off the goal date)
#   tune_up   a race that's a data point — quality stays three days clear of it
#   strength  non-running — an entry with no session
#   rest      a written rest day, zero steps, so the rest rule is checkable
#   other     a run with no role-scoped rule — the escape hatch, so "no role" never is
# Your own `tags:` can sit alongside it; don't hand-write a `nocoach:` one.
week: YYYY-Wnn
# targets: hard-only   # optional per-week override — targets on hard efforts only
#                      # (default is 'all': pace/HR shown on every step)
workouts:
  - date: YYYY-MM-DD
    name: "Easy 7km + strides"
    type: Run
    role: easy
    description: |
      - 7km

      Strides 4x
      - 20s
      - 60s intensity=recovery

      Easy ~5:10-5:40/km, then 4 strides at the end — relaxed-fast, tall
      posture, quick feet, walk/jog the 60s back. Not sprints.

  - date: YYYY-MM-DD
    name: "Reps 6x2min"
    type: Run
    role: key
    description: |
      Warmup
      - 2km

      Main 6x
      - 2m 4:05-4:15/km Pace intensity=interval
      - 90s intensity=recovery

      Cooldown
      - 2km

      Warmup/cooldown easy ~5:10-5:40/km, 90s recovery jog between reps.
      Controlled — finish feeling you could do two more.
